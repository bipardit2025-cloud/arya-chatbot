<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arya — AI Assistant</title>

    <!-- Permanent Arya mascot favicon (matches the chatbot logo) -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f6feb'/%3E%3Crect x='5' y='8' width='14' height='10' rx='3' fill='%23fff'/%3E%3Ccircle cx='9.5' cy='13' r='1.7' fill='%231f6feb'/%3E%3Ccircle cx='14.5' cy='13' r='1.7' fill='%231f6feb'/%3E%3Crect x='11' y='3.5' width='2' height='3.5' fill='%2300d4e0'/%3E%3Ccircle cx='12' cy='3' r='1.7' fill='%2300d4e0'/%3E%3C/svg%3E" />

    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Outfit:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(1200px 600px at 50% -10%, #143a63, #0a1726 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Full-page mode: center the panel, no overlay backdrop. */
        #arya-root #arya-overlay {
            position: static !important;
            display: flex !important;
            background: transparent !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 0 !important;
        }

        #arya-root #arya-panel {
            width: min(1100px, 96vw) !important;
            height: min(760px, 94vh) !important;
            margin: 0 !important;
            box-shadow: 0 30px 100px -20px rgba(0, 0, 0, .6) !important;
        }

        #arya-root #arya-stage {
            width: 340px !important;
        }

        /* Hide floating bubble + close + maximize on the full page */
        #arya-root #arya-bubble,
        #arya-root #arya-close,
        #arya-root #arya-max {
            display: none !important;
        }
    </style>
</head>

<body>
    <script>
        // Full-page route: open the panel and trigger the voiced welcome once.
        window.addEventListener("load", function () {
            var t = setInterval(function () {
                var ov = document.getElementById("arya-overlay");
                if (ov) {
                    ov.classList.add("open");
                    // Fire the same first-open greeting logic used by the bubble.
                    if (window.__aryaOpen) window.__aryaOpen();
                    clearInterval(t);
                }
            }, 100);
        });
    </script>
    <script src="widget.js"></script>
</body>

</html>
