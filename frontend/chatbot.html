<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arya — BICTU AI Assistant</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Outfit:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0
        }

        html,
        body {
            height: 100%
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f2238, #0a1726);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh
        }

        /* The widget renders its own panel; here we make it fill the page nicely. */
        #arya-root #arya-overlay {
            position: static !important;
            display: flex !important;
            background: transparent !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 0 !important
        }

        #arya-root #arya-panel {
            width: min(1100px, 96vw) !important;
            height: min(760px, 94vh) !important;
            margin: 0 !important;
            box-shadow: 0 30px 100px -20px rgba(0, 0, 0, .6) !important
        }

        #arya-root #arya-stage {
            width: 340px !important
        }

        /* Hide the floating bubble + close button on the full page */
        #arya-root #arya-bubble {
            display: none !important
        }

        #arya-root #arya-close {
            display: none !important
        }

        #arya-root #arya-max {
            display: none !important
        }
    </style>
</head>

<body>
    <!-- The widget injects everything; CSS above makes it a full page. -->
    <script>
        // Auto-open the panel on load for the full-page route.
        window.addEventListener("load", function () {
            var t = setInterval(function () {
                var ov = document.getElementById("arya-overlay");
                if (ov) { ov.classList.add("open"); clearInterval(t); }
            }, 100);
        });
    </script>
    <script src="widget.js"></script>
</body>

</html>
